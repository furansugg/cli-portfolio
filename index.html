<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Furansu's portfolio — a command-line style website. Type 'help' to get started."
    />
    <meta name="color-scheme" content="dark" />
    <title>furansugg ~ portfolio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23000'/%3E%3Ctext x='2' y='12' font-family='monospace' font-size='10' fill='%2300ff66'%3E%26gt;_%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="terminal" id="terminal" aria-label="Interactive terminal">
      <header class="title-bar" aria-hidden="true">
        <div class="dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <div class="title">visitor@furansugg: ~/portfolio</div>
        <div class="title-spacer"></div>
      </header>

      <section
        class="screen"
        id="screen"
        tabindex="0"
        role="log"
        aria-live="polite"
      >
        <div id="output"></div>
        <div class="prompt-line" id="promptLine">
          <span class="prompt" id="prompt"></span>
          <span class="input-wrap">
            <input
              id="cmdInput"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Command input"
            />
            <span class="caret" id="caret">&nbsp;</span>
          </span>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
